[package]
name = "polyhydra-whale-signal"
version = "0.1.0"
edition = "2021"
description = "Phase 5: Cross-Market Orderbook Feeds"

[dependencies]
tokio = { version = "1", features = ["full", "macros"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
axum = "0.7"
strsim = "0.11.1"
